# settings
set-option -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set-option -g automatic-rename off
set-option -g allow-rename off
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# copy-mode on y, mirrors herdr
bind 'y' copy-mode

set -g mouse on                  # Activate mouse mode
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g focus-events on           # lets nvim detect focus (autoread)

# binding

# prefix C-f instead of C-b
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix

# tab splitting
unbind %
bind v split-window -h -c "#{pane_current_path}"

unbind '"'
bind h split-window -v -c "#{pane_current_path}"

# skip confirmation when closing a pane
bind x kill-pane

# rebind closing of windows and skip confirmation
unbind '&'
bind X kill-window

# Resize with Opt-Arrow
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# Switch pane layout using shortcuts
bind-key L select-layout even-horizontal

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

bind-key "k" run-shell "sesh connect \"$(
  sesh list -tz --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' Sesjoner ' --prompt '⚡  ' \
    --header '  ^a all ^f configs ^t sessions ^x zoxide ^d tmux kill' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-f:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list -zt --icons)' \
    --bind 'ctrl-r:execute(tmux rename-session -t {2..} {q})+change-prompt(⚡  )+reload(sesh list -zt --icons)' \
    --bind 'q:abort' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Theme (catppuccin mocha)
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#{?client_prefix,#f38ba8,#a6e3a1}]#[fg=#11111b,bg=#{?client_prefix,#f38ba8,#a6e3a1}] #[fg=#cdd6f4,bg=#313244] #S#[fg=#313244] "
# Must be set before tpm, continuum hooks its autosave into status-right
set -g status-right "#[fg=#eba0ac]#[fg=#11111b,bg=#eba0ac] #[fg=#cdd6f4,bg=#313244] #{pane_current_command}#[fg=#313244] "
set -g window-status-format '#[fg=#11111b,bg=#9399b2] #I #[fg=#cdd6f4,bg=#313244] #W#{?window_zoomed_flag, 🔍,} '
set -g window-status-current-format '#[fg=#11111b,bg=#cba6f7] #I #[fg=#cdd6f4,bg=#45475a] #W#{?window_zoomed_flag, 🔍,} '
set -g window-status-current-style default
set -g message-style 'fg=#94e2d5,bg=default,align=centre'
set -g message-command-style 'fg=#94e2d5,bg=default,align=centre'
set -g mode-style 'bg=#313244,bold'
set -g popup-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#f9e2af,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

run '~/.tmux/plugins/tpm/tpm'
